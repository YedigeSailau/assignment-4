<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a train ticket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --green: #0F6B5F;
      --amber: #F2A93B;
      --ink: #16302B;
      --field: #F4F7F5;
      --line: #E6EFEC;
    }
    body { font-family: "Montserrat", sans-serif; background: var(--line); color: var(--ink); }

    /* Card */
    .ticket-card { border: 0; border-radius: 1.5rem; overflow: hidden;
                   box-shadow: 0 1.5rem 3rem rgba(22, 48, 43, .18); }
    .ticket-card .card-header { background: var(--green); color: #fff; border: 0;
                                padding: 1.25rem 1.5rem; }
    .ticket-card .card-header h1 { font-size: 1.25rem; font-weight: 700; margin: 0; }
    .ticket-card .card-body { padding: 1.75rem 1.5rem; }
    @media (min-width: 768px) {
      .ticket-card .card-header { padding: 1.5rem 2rem; }
      .ticket-card .card-body { padding: 2.5rem 2rem; }
      .ticket-card .card-header h1 { font-size: 1.5rem; }
    }

    /* Labels and fields */
    .form-label, legend.form-label { font-size: .8rem; font-weight: 600; color: var(--ink);
                                     float: none; margin-bottom: .35rem; }
    .form-control, .form-select { background-color: var(--field); border: 1px solid var(--line);
                                  border-radius: .75rem; color: var(--ink); font-size: .85rem; }
    .form-control::placeholder { color: #8aa09b; }
    .form-control:focus, .form-select:focus { border-color: var(--green);
                                              box-shadow: 0 0 0 .2rem rgba(15, 107, 95, .2); }
    .form-floating > label { color: #6f8782; font-size: .75rem; }

    /* One way / Round trip (two radios shown as a button group) */
    .trip-toggle { display: flex; width: 100%; }
    @media (min-width: 576px) { .trip-toggle { display: inline-flex; width: auto; } }
    .trip-toggle .btn { flex: 1 1 0; font-size: .85rem; font-weight: 600; padding: .45rem 1.25rem;
                        color: var(--green); border: 1px solid var(--green); background: #fff; }
    .trip-toggle .btn:first-of-type { border-radius: 999px 0 0 999px; }
    .trip-toggle .btn:last-of-type { border-radius: 0 999px 999px 0; }
    .btn-check:checked + .btn.trip-btn { background: var(--green); color: #fff; border-color: var(--green); }
    .btn-check:focus-visible + .btn.trip-btn { box-shadow: 0 0 0 .2rem rgba(15, 107, 95, .35); }

    /* Radios, switch, checkbox */
    .form-check-label { font-size: .85rem; }
    .form-check-input:checked { background-color: var(--green); border-color: var(--green); }
    .form-check-input:focus { border-color: var(--green); box-shadow: 0 0 0 .2rem rgba(15, 107, 95, .25); }

    /* Phone input group */
    .input-group-text { background: var(--green); color: #fff; font-weight: 600; font-size: .85rem;
                        border: 1px solid var(--green); border-radius: .75rem 0 0 .75rem; }
    .input-group > .form-control { border-radius: 0 .75rem .75rem 0; }

    /* Buttons */
    .btn-action { border-radius: 999px; font-weight: 700; font-size: .85rem; padding: .65rem 1.75rem; }
    .btn-find { background: var(--amber); border: 1px solid var(--amber); color: #fff; }
    .btn-find:hover, .btn-find:focus-visible { background: #e29b2c; border-color: #e29b2c; color: #fff; }
    .btn-clear { background: #fff; border: 1px solid var(--ink); color: var(--ink); }
    .btn-clear:hover, .btn-clear:focus-visible { background: var(--ink); color: #fff; }
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9 col-xl-8">
        <div class="card ticket-card">
          <div class="card-header"><h1>Book a train ticket</h1></div>
          <div class="card-body">
            <form action="#" method="get">
              <!-- 1. Button-group of two radio inputs -->
              <div class="mb-4">
                <div class="trip-toggle" role="group" aria-label="Trip type">
                  <input type="radio" class="btn-check" name="trip" id="oneway" value="oneway" checked>
                  <label class="btn trip-btn" for="oneway">One way</label>
                  <input type="radio" class="btn-check" name="trip" id="round" value="round">
                  <label class="btn trip-btn" for="round">Round trip</label>
                </div>
              </div>

              <div class="row g-3">
                <!-- 2. Floating labels -->
                <div class="col-12 col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="from" name="from" value="Astana"
                           placeholder="From" required autocomplete="off">
                    <label for="from">From</label>
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control" id="to" name="to" value="Almaty"
                           placeholder="To" required autocomplete="off">
                    <label for="to">To</label>
                  </div>
                </div>

                <!-- 3. Date inputs + select -->
                <div class="col-12 col-md-4">
                  <label for="departure" class="form-label">Departure</label>
                  <input type="date" class="form-control" id="departure" name="departure" required>
                </div>
                <div class="col-12 col-md-4">
                  <label for="return" class="form-label">Return</label>
                  <input type="date" class="form-control" id="return" name="return">
                </div>
                <div class="col-12 col-md-4">
                  <label for="passengers" class="form-label">Passengers</label>
                  <select class="form-select" id="passengers" name="passengers">
                    <option value="1" selected>1 adult</option>
                    <option value="2">2 adults</option>
                    <option value="3">3 adults</option>
                    <option value="4">4 adults</option>
                    <option value="5">5 adults</option>
                    <option value="6">6 adults</option>
                  </select>
                </div>

                <!-- 4. Inline radios in a fieldset -->
                <div class="col-12">
                  <fieldset>
                    <legend class="form-label">Carriage class</legend>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="carriage" id="seat" value="seat" required>
                      <label class="form-check-label" for="seat">Seat</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="carriage" id="coupe" value="coupe" checked required>
                      <label class="form-check-label" for="coupe">Coupé</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="carriage" id="sleeper" value="sleeper" required>
                      <label class="form-check-label" for="sleeper">Sleeper</label>
                    </div>
                  </fieldset>
                </div>

                <!-- 5. Input group (+7) and email -->
                <div class="col-12 col-md-6">
                  <label for="phone" class="form-label">Phone</label>
                  <div class="input-group">
                    <span class="input-group-text" id="phone-prefix">+7</span>
                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78"
                           required autocomplete="tel-national" aria-describedby="phone-prefix">
                  </div>
                </div>
                <div class="col-12 col-md-6">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="email" name="email"
                         placeholder="name@example.com" required autocomplete="email">
                </div>

                <!-- 6. Switch and checkbox -->
                <div class="col-12">
                  <div class="form-check form-switch mb-2">
                    <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms" value="yes">
                    <label class="form-check-label" for="sms">Also send the ticket by SMS</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="agree" name="agree" value="yes" required>
                    <label class="form-check-label" for="agree">I agree with the carriage rules</label>
                  </div>
                </div>

                <!-- 7. Buttons: HTML order is Clear, Find trains.
                       On a phone flex-column-reverse puts "Find trains" on top. -->
                <div class="col-12">
                  <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2 mt-2">
                    <button type="reset" class="btn btn-action btn-clear">Clear</button>
                    <button type="submit" class="btn btn-action btn-find">Find trains</button>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
